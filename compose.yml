services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_PATH: ${DB_PATH:-/app/database/local/app.db}
      SNAPSHOT_DIR: ${SNAPSHOT_DIR:-/app/database/snapshots}
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_CACHE_DIR: /app/database/local/exa-cache
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-40}
      ANALYSIS_MAX_BATCHES: ${ANALYSIS_MAX_BATCHES:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./database/local:/app/database/local
      - ./database/snapshots:/app/database/snapshots
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-180}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_CACHE_DIR: /app/exa-cache
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./database/local/exa-cache:/app/exa-cache

  web:
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      EHL_API_URL: http://api:8000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3003}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/g60/us').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read-only browser over a snapshot (never the live database): docker compose --profile inspect up -d inspect
  inspect:
    profiles: ["inspect"]
    image: datasetteproject/datasette:0.65.1
    entrypoint: ["/inspect/serve.sh"]
    environment:
      INSPECT_DB: ${INSPECT_DB:-}
    ports:
      - "127.0.0.1:${INSPECT_PORT:-8002}:8001"
    volumes:
      - ./database/snapshots:/snapshots:ro
      - ./database/inspect:/inspect:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/-/versions.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
