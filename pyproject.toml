[project]
name = "bmw-product-evidence"
version = "0.2.0"
description = "BMW customer evidence to product decisions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "pypdf[crypto]>=5,<7",
  "httpx>=0.28,<1",
  "mcp==2.3.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
