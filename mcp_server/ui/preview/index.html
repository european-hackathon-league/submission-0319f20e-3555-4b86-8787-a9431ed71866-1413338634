<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget preview</title>
    <style>
      body { margin: 0; padding: 24px; font: 13px system-ui, sans-serif; background: #e9ebef; color: #1b1f24; }
      form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
      #host { width: 720px; max-width: 100%; background: #fff; box-shadow: 0 1px 4px #0002; }
      iframe { display: block; width: 100%; height: 405px; border: 0; }
      #size { font-family: ui-monospace, monospace; color: #555; }
    </style>
  </head>
  <body>
    <form id="controls">
      <label>App <select id="app"><option value="scoring">Scoring</option><option value="trace">Trace</option></select></label>
      <label>Host width <select id="width"><option>720</option><option>760</option><option>640</option><option>560</option><option>400</option></select></label>
      <label>Theme <select id="theme"><option>light</option><option>dark</option></select></label>
      <span id="size"></span>
    </form>
    <div id="host"><iframe id="frame" title="Widget"></iframe></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
